name: Feature request
description: Suggest something this tool should report or do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Two things to know first: this tool only reports what your
        agents actually wrote to disk (it never guesses a number), and it never sends data
        off your machine. Ideas that need either are out of scope.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or question you could not answer, rather than the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see
      description: A command, an MCP tool or a report. A sketch of the output helps.
    validations:
      required: true

  - type: dropdown
    id: client
    attributes:
      label: Which client does this involve?
      multiple: true
      options:
        - Claude Code
        - OpenCode
        - A client that is not supported yet
        - Not client specific
    validations:
      required: true

  - type: textarea
    id: data
    attributes:
      label: Does the data exist?
      description: >
        If you know where the client records what this needs (a file, a table, a field),
        say so. If you do not, that is fine: just say that.

  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried instead?
