name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Pack and validate without publishing'
        type: boolean
        default: false

permissions:
  # `contents: write` is needed to create the GitHub Release; the tag itself is
  # pushed by hand, so this only ever adds a release entry for a tag that exists.
  contents: write
  # Required for npm provenance: npm exchanges this OIDC token for a signed
  # attestation, which is what produces the verified badge on the package page.
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing and --provenance need a recent npm.
      - name: Use a current npm
        run: npm install -g npm@latest

      - run: npm ci

      - name: Full check (typecheck, lint, format, build, tests)
        run: npm run check

      - name: Confirm the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "tag and package.json agree on $PKG"

      - name: Confirm server.json agrees with package.json
        run: |
          PKG=$(node -p "require('./package.json').version")
          SRV=$(node -p "require('./server.json').version")
          PKGV=$(node -p "require('./server.json').packages[0].version")
          MCP_PKG=$(node -p "require('./package.json').mcpName")
          MCP_SRV=$(node -p "require('./server.json').name")
          if [ "$SRV" != "$PKG" ] || [ "$PKGV" != "$PKG" ]; then
            echo "::error::server.json version ($SRV) / packages[0].version ($PKGV) do not match package.json ($PKG)"
            exit 1
          fi
          if [ "$MCP_PKG" != "$MCP_SRV" ]; then
            echo "::error::package.json mcpName ($MCP_PKG) does not match server.json name ($MCP_SRV); the registry rejects a mismatch"
            exit 1
          fi
          echo "server.json and package.json agree on $PKG / $MCP_SRV"

      - name: Skip if this version is already on the registry
        id: check
        run: |
          PKG=$(node -p "require('./package.json').version")
          if npm view "ai-usage-mcp@$PKG" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::ai-usage-mcp@$PKG is already published; nothing to do"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.check.outputs.already == 'false' && inputs.dry-run != true
        # With a trusted publisher configured on npmjs.com no secret is needed --
        # OIDC handles auth. NODE_AUTH_TOKEN is the fallback for a granular token.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Extract this version's changelog section
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section"
            exit 1
          fi
          echo "extracted $(wc -l < release-notes.md) lines of notes for $VERSION"

      - name: Create the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry-run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::release $GITHUB_REF_NAME already exists; leaving it alone"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              --verify-tag
          fi

      - name: Dry run
        if: inputs.dry-run == true
        run: npm pack --dry-run

  registry:
    name: Publish to the MCP registry
    needs: publish
    # Only for a real tagged release. The registry reads `mcpName` out of the
    # published npm tarball, so this must run strictly after the npm publish
    # job -- a separate tag-triggered workflow would race it and fail
    # validation on a version npm has not served yet.
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry-run != true
    runs-on: ubuntu-latest
    permissions:
      # github-oidc login exchanges this token for a registry JWT; the grant it
      # returns is io.github.<repository_owner>/*, so no secret is involved.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --version

      - name: Validate server.json
        run: ./mcp-publisher validate server.json

      # npm needs a moment before a just-published version is readable from the
      # registry's side; without this the ownership check can 404 on the tarball.
      - name: Wait for the new version to be visible on npm
        run: |
          PKG=$(node -p "require('./package.json').version")
          for i in $(seq 1 20); do
            if npm view "ai-usage-mcp@$PKG" version >/dev/null 2>&1; then
              echo "ai-usage-mcp@$PKG is live on npm"
              exit 0
            fi
            echo "attempt $i: ai-usage-mcp@$PKG not visible yet; retrying in 15s"
            sleep 15
          done
          echo "::error::ai-usage-mcp@$PKG never became visible on npm"
          exit 1

      - name: Authenticate to the MCP registry
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
