name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Pack and validate without publishing'
        type: boolean
        default: false

permissions:
  # `contents: write` is needed to create the GitHub Release; the tag itself is
  # pushed by hand, so this only ever adds a release entry for a tag that exists.
  contents: write
  # Required for npm provenance: npm exchanges this OIDC token for a signed
  # attestation, which is what produces the verified badge on the package page.
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing and --provenance need a recent npm.
      - name: Use a current npm
        run: npm install -g npm@latest

      - run: npm ci

      - name: Full check (typecheck, lint, format, build, tests)
        run: npm run check

      - name: Confirm the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "tag and package.json agree on $PKG"

      - name: Skip if this version is already on the registry
        id: check
        run: |
          PKG=$(node -p "require('./package.json').version")
          if npm view "ai-usage-mcp@$PKG" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::ai-usage-mcp@$PKG is already published; nothing to do"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.check.outputs.already == 'false' && inputs.dry-run != true
        # With a trusted publisher configured on npmjs.com no secret is needed --
        # OIDC handles auth. NODE_AUTH_TOKEN is the fallback for a granular token.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Extract this version's changelog section
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section"
            exit 1
          fi
          echo "extracted $(wc -l < release-notes.md) lines of notes for $VERSION"

      - name: Create the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry-run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::release $GITHUB_REF_NAME already exists; leaving it alone"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              --verify-tag
          fi

      - name: Dry run
        if: inputs.dry-run == true
        run: npm pack --dry-run
