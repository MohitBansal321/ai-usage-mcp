# Temporary: determines whether better-sqlite3's bundled prebuilt binary is
# usable on Windows + Node 22, or whether that combination genuinely requires
# compiling from source. Delete once the question is settled.
name: Diagnose Windows install

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-win.yml']

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Report the toolchain and what npm thinks of better-sqlite3
        shell: bash
        run: |
          {
            echo "### Toolchain"
            echo "- node: \`$(node -v)\`"
            echo "- npm: \`$(npm -v)\`"
            echo ""
            echo "### better-sqlite3 manifest as npm sees it"
            echo '```'
            npm view better-sqlite3@13.0.3 gypfile scripts 2>&1 | head -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install without running any package scripts
        id: noscripts
        shell: bash
        run: npm ci --ignore-scripts 2>&1 | tail -5

      - name: Can the bundled prebuilt binary actually load and run?
        id: loadtest
        shell: bash
        run: |
          set -o pipefail
          node -e "
            const S = require('better-sqlite3');
            const db = new S(':memory:');
            db.exec('create table t(a)');
            db.prepare('insert into t values (?)').run(42);
            const row = db.prepare('select a from t').get();
            if (row.a !== 42) { console.error('wrong value'); process.exit(1); }
            const loaded = Object.keys(require.cache).filter((k) => k.endsWith('.node'));
            console.log('OK, loaded:', loaded.join(', '));
            db.close();
          " 2>&1 | tee load.log
          {
            echo ""
            echo "### Prebuilt binary load test (after --ignore-scripts)"
            echo '```'
            cat load.log
            echo '```'
            echo ""
            if [ -d node_modules/better-sqlite3/build ]; then
              echo "build/ directory PRESENT -> it compiled"
            else
              echo "build/ directory ABSENT -> no compilation happened; the bundled prebuild was used"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Emit the verdict as an annotation
        if: always()
        shell: bash
        run: |
          if [ -d node_modules/better-sqlite3/build ]; then
            verdict="COMPILED from source"
          else
            verdict="used bundled PREBUILD, no compiler needed"
          fi
          echo "::error title=Windows Node 22 verdict::npm $(npm -v) | ignore-scripts install then load: ${{ steps.loadtest.outcome }} | $verdict"
